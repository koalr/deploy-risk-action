name: 'Koalr Deploy Risk'
description: 'Score your pull request for deployment risk and post results as a PR comment'
author: 'Koalr'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  koalr-api-key:
    description: 'Koalr API key (starts with koalr_). Generate in Koalr → Settings → API Keys.'
    required: true
  koalr-api-url:
    description: 'Koalr API base URL (default: production)'
    required: false
    default: 'https://api.koalr.com'
  github-token:
    description: 'GitHub token for posting PR comments and check runs'
    required: false
    default: '${{ github.token }}'
  fail-on-risk-level:
    description: 'Fail the action if risk reaches this level: LOW | MEDIUM | HIGH | CRITICAL'
    required: false
    default: 'CRITICAL'
  post-check-run:
    description: 'Create a GitHub Check Run in addition to the PR comment'
    required: false
    default: 'true'

outputs:
  score:
    description: 'Risk score (0-100)'
  level:
    description: 'Risk level: LOW | MEDIUM | HIGH | CRITICAL'

runs:
  using: 'node24'
  main: 'dist/index.js'
